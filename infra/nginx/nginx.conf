worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  # Compresión de respuestas de texto
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/xml+rss text/javascript image/svg+xml;

  # Caché de assets estáticos del frontend (RNF-015)
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:16m
                   max_size=512m inactive=7d use_temp_path=off;

  # Rate limiting en el borde — segunda capa por encima del guard de Redis (RNF-006)
  limit_req_zone $binary_remote_addr zone=api_limit:16m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=auth_limit:8m rate=5r/m;
  limit_req_status 429;

  upstream backend_upstream {
    server backend:3001;
    keepalive 32;
  }

  upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
  }

  # --- Redirección forzada a HTTPS ------------------------------------------
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- Servidor TLS principal -----------------------------------------------
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.3 preferente, 1.2 como piso de compatibilidad (RNF-001)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Cabeceras de seguridad (RNF-007). El CSP de la app lo emite helmet en el backend.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    client_max_body_size 2m;

    # --- API -----------------------------------------------------------------
    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_cache off;
    }

    # Endpoints de autenticación: límite mucho más estricto (fuerza bruta)
    location ~ ^/api/v1/auth/(login|register|refresh) {
      limit_req zone=auth_limit burst=3 nodelay;
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket (actualizaciones de ruta en tiempo real) -------------------
    location /socket.io/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
      proxy_read_timeout 3600s;
    }

    # --- Assets estáticos de Next.js -----------------------------------------
    location /_next/static/ {
      proxy_pass http://frontend_upstream;
      proxy_cache static_cache;
      proxy_cache_valid 200 7d;
      add_header X-Cache-Status $upstream_cache_status;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # --- Frontend -------------------------------------------------------------
    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
